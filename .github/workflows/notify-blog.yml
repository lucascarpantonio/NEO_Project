name: Notify Blog on Blog Branch Update

on:
  push:
    branches:
      - blog

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger update on lucascarpantonio.github.io
        env:
          GH_TOKEN: ${{ secrets.BLOG_TRIGGER_TOKEN }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lucascarpantonio/lucascarpantonio.github.io/actions/workflows/update-projects.yml/dispatches \
            -d '{"ref":"main"}'
            