name: Notify Blog on Blog Branch Update

on:
  push:
    branches:
      - blog

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Debug info
        run: echo "Triggering lucascarpantonio.github.io workflow..."

      - name: Send repository dispatch to blog
        env:
          GH_TOKEN: ${{ secrets.BLOG_TRIGGER_TOKEN }}
        run: |
          curl -i -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/lucascarpantonio/lucascarpantonio.github.io/dispatches \
            -d '{"event_type": "update_projects"}'